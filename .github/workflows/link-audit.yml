name: Evidence link audit

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-link-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Build and verify public evidence links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack npm ci
      - run: corepack npm install-scripts ls
      - run: corepack npm run build
      - run: corepack npm run link:audit:static -- --summary "$GITHUB_STEP_SUMMARY"
      - run: corepack npm run link:audit:live -- --origin https://mainlanddispatch.com --summary "$GITHUB_STEP_SUMMARY"
